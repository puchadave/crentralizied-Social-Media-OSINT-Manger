services:
  frontend:
    build:
      context: ./frontend
    image: control-center-frontend:dev
    ports:
      - "5173:4173"
    depends_on:
      - core-api
  core-api:
    build:
      context: ./services/core-api
    image: control-center-core-api:dev
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

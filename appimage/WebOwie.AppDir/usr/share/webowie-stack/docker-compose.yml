version: "3.9"

services:
  matomo-db:
    image: mariadb:10.6
    container_name: matomo-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MATOMO_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MATOMO_DB_NAME}
      MYSQL_USER: ${MATOMO_DB_USER}
      MYSQL_PASSWORD: ${MATOMO_DB_PASSWORD}
    command: ["mysqld", "--max-allowed-packet=64M", "--innodb-log-file-size=256M"]
    volumes:
      - matomo-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  matomo:
    image: matomo:4-apache
    container_name: matomo
    restart: unless-stopped
    depends_on:
      matomo-db:
        condition: service_healthy
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_DBNAME: ${MATOMO_DB_NAME}
      MATOMO_DATABASE_USERNAME: ${MATOMO_DB_USER}
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD}
      MATOMO_GENERAL_FORCE_SSL: "0"
      PHP_DATE_TIMEZONE: ${TIMEZONE}
    ports:
      - "4000:80"
    volumes:
      - matomo-html:/var/www/html

  seo-panel:
    image: seopanel/seopanel:4.11.0
    container_name: seo-panel
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      TZ: ${TIMEZONE}
    ports:
      - "${SEOPANEL_HTTP_PORT}:80"
    volumes:
      - seo-panel-data:/var/www/html

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      TZ: ${TIMEZONE}
    volumes:
      - redis-data:/data

  mautic-db:
    image: mariadb:10.6
    container_name: mautic-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MAUTIC_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MAUTIC_DB_NAME}
      MYSQL_USER: ${MAUTIC_DB_USER}
      MYSQL_PASSWORD: ${MAUTIC_DB_PASSWORD}
    command: ["mysqld", "--max-allowed-packet=64M", "--sql-mode=STRICT_TRANS_TABLES"]
    volumes:
      - mautic-db:/var/lib/mysql

  mautic:
    image: mautic/mautic:v4
    container_name: mautic
    restart: unless-stopped
    depends_on:
      - mautic-db
      - redis
    environment:
      MAUTIC_DB_HOST: mautic-db
      MAUTIC_DB_NAME: ${MAUTIC_DB_NAME}
      MAUTIC_DB_USER: ${MAUTIC_DB_USER}
      MAUTIC_DB_PASSWORD: ${MAUTIC_DB_PASSWORD}
      MAUTIC_RUN_CRON_JOBS: "true"
      MAUTIC_CRON_FORCE: "true"
      MAUTIC_TRUSTED_PROXIES: 0.0.0.0/0
      PHP_INI_DATE_TIMEZONE: ${TIMEZONE}
      MAUTIC_URL: http://${MAUTIC_FQDN}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "8050:80"
    volumes:
      - mautic-html:/var/www/html

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    depends_on:
      - redis
      - opensearch
      - spiderfoot
    environment:
      GENERIC_TIMEZONE: ${TIMEZONE}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://${DOMAIN}:5678/
      VUE_APP_URL_BASE_API: http://${DOMAIN}:5678/
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPIDERFOOT_BASE_URL: ${SPIDERFOOT_BASE_URL}
      SPIDERFOOT_API_KEY: ${SPIDERFOOT_API_KEY}
      OPENSEARCH_HOST: ${OPENSEARCH_HOST}
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n

  listmonk-db:
    image: postgres:17-alpine
    container_name: listmonk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LISTMONK_DB_USER}
      POSTGRES_PASSWORD: ${LISTMONK_DB_PASSWORD}
      POSTGRES_DB: ${LISTMONK_DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LISTMONK_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - listmonk-db:/var/lib/postgresql/data

  listmonk:
    image: listmonk/listmonk:latest
    container_name: listmonk
    restart: unless-stopped
    depends_on:
      listmonk-db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
          ./listmonk --install --idempotent --yes \
          && ./listmonk --upgrade --yes \
          && ./listmonk
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: listmonk-db
      LISTMONK_db__port: 5432
      LISTMONK_db__user: ${LISTMONK_DB_USER}
      LISTMONK_db__password: ${LISTMONK_DB_PASSWORD}
      LISTMONK_db__database: ${LISTMONK_DB_NAME}
      LISTMONK_db__ssl_mode: disable
      LISTMONK_ADMIN_USER: ${LISTMONK_ADMIN_USER}
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD}
      TZ: ${TIMEZONE}
    ports:
      - "9000:9000"
    volumes:
      - listmonk-uploads:/listmonk/uploads

  keycloak-db:
    image: postgres:15-alpine
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
    volumes:
      - keycloak-db:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    restart: unless-stopped
    depends_on:
      - keycloak-db
    command: ["start-dev", "--http-enabled=true", "--http-port=${KEYCLOAK_HTTP_PORT}"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_PROXY: edge
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "${KEYCLOAK_HTTP_PORT}:${KEYCLOAK_HTTP_PORT}"
    volumes:
      - keycloak-data:/opt/keycloak/data

  appsmith:
    image: appsmith/appsmith-ce
    container_name: appsmith
    restart: unless-stopped
    environment:
      APPSMITH_DISABLE_TELEMETRY: "true"
      APPSMITH_ALLOWED_FRAME_ANCESTORS: "*"
      APPSMITH_CUSTOM_DOMAIN: ${APPSMITH_CUSTOM_DOMAIN}
      APPSMITH_COOKIE_DOMAIN: ${APPSMITH_COOKIE_DOMAIN}
      APPSMITH_INSTANCE_NAME: ${APPSMITH_INSTANCE_NAME}
      APPSMITH_ENCRYPTION_PASSWORD: ${APPSMITH_ENCRYPTION_PASSWORD}
      APPSMITH_ENCRYPTION_SALT: ${APPSMITH_ENCRYPTION_SALT}
      APPSMITH_LOGIN_FORM_ENABLED: "true"
    ports:
      - "${APPSMITH_HTTP_PORT}:80"
    volumes:
      - appsmith-stacks:/appsmith-stacks

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: unless-stopped
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_SITE_LOCALE: de
      MB_SITE_NAME: WebOwie Analytics
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1g"
    ports:
      - "${METABASE_HTTP_PORT}:3000"
    volumes:
      - metabase-data:/metabase-data

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms${OPENSEARCH_JAVA_HEAP} -Xmx${OPENSEARCH_JAVA_HEAP}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_HTTP_PORT}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: opensearch-dashboards
    restart: unless-stopped
    depends_on:
      - opensearch
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT}:5601"

  spiderfoot:
    image: smicallef/spiderfoot:latest
    container_name: spiderfoot
    restart: unless-stopped
    depends_on:
      - opensearch
    environment:
      TZ: ${TIMEZONE}
    ports:
      - "${SPIDERFOOT_HTTP_PORT}:5001"
    volumes:
      - spiderfoot-data:/var/lib/spiderfoot

  ollama:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG}
    container_name: ollama
    restart: unless-stopped
    tty: true
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ""
      TZ: ${TIMEZONE}
    ports:
      - "${OPEN_WEBUI_PORT}:8080"
    volumes:
      - open-webui-data:/app/backend/data

volumes:
  matomo-db:
  matomo-html:
  seo-panel-data:
  redis-data:
  mautic-db:
  mautic-html:
  n8n-data:
  listmonk-db:
  listmonk-uploads:
  keycloak-db:
  keycloak-data:
  appsmith-stacks:
  metabase-data:
  ollama-data:
  open-webui-data:
  opensearch-data:
  spiderfoot-data:
